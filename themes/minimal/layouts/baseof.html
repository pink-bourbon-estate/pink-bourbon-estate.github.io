<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Title }}{{ if not .IsHome }} | {{ .Title }}{{ end }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; color: #333; background: #f9f9f9; }
        header { background: white; border-bottom: 1px solid #eee; padding: 2rem 0; }
        nav { max-width: 900px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav h1 { font-size: 1.5rem; }
        nav ul { list-style: none; display: flex; gap: 2rem; }
        nav a { text-decoration: none; color: #333; }
        nav a:hover { color: #666; }
        main { max-width: 900px; margin: 0 auto; padding: 3rem 2rem; background: white; min-height: calc(100vh - 200px); }
        h1 { margin-bottom: 1rem; font-size: 2rem; }
        h2 { margin: 2rem 0 1rem; font-size: 1.5rem; }
        p { margin-bottom: 1rem; }
        a { color: #0066cc; }
        a:hover { text-decoration: underline; }
        code { background: #f4f4f4; padding: 0.2rem 0.4rem; border-radius: 3px; font-family: monospace; }
        footer { background: #333; color: white; text-align: center; padding: 2rem; margin-top: 3rem; }
        footer a { color: #099; }
    </style>
</head>
<body>
    <header>
        <nav>
            <h1><a href="/">{{ .Site.Title }}</a></h1>
            <ul>
                {{ range .Site.Menus.main }}
                <li><a href="{{ .URL }}">{{ .Name }}</a></li>
                {{ end }}
            </ul>
        </nav>
    </header>
    <main>
        {{ block "content" . }}{{ end }}
    </main>
    <footer>
        <p>© {{ now.Year }} Pink Bourbon Estate · <a href="https://github.com/pink-bourbon-estate">GitHub</a> · Open source</p>
    </footer>
</body>
</html>
