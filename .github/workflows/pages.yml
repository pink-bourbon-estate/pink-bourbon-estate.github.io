name: Website

# The site is plain hand-written HTML and CSS. The only thing built here is Pattern Kit's
# engine: its Rust code (from the Toolkits repository) is compiled to WebAssembly so the tool
# runs in the visitor's browser, and is published next to the page.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'   # daily, so "Now reading" stays current

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Pattern Kit source (public repository)
        uses: actions/checkout@v4
        with:
          repository: pink-bourbon-estate/Toolkits
          path: _toolkits
      - name: Build the Pattern Kit engine as WebAssembly
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
          cd _toolkits/patternkit
          cargo build --release --lib --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/patternkit.wasm "$GITHUB_WORKSPACE/sewing-and-knitting-pattern-maker/patternkit.wasm"
          cp web/app.js "$GITHUB_WORKSPACE/sewing-and-knitting-pattern-maker/app.js"
      - name: Look up recent articles from independent magazines (links only, polite)
        continue-on-error: true
        run: python3 .github/scripts/reading.py
      # ---- Street-map tiles for the Travel Map: rebuilt once a month, then reused from the cache on every other run ----
      # Roads of Great Britain come from Ordnance Survey's OS Open Roads (free, Open Government Licence); footpaths, tracks and
      # cycleways come from an OpenStreetMap extract. See .github/scripts/build_roads.py. Visitors then read these files from the
      # site itself, so nobody's server is asked for roads each time someone opens the map.
      - name: Month stamp
        id: month
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Reuse this month's road tiles if they are already built
        id: roadcache
        uses: actions/cache/restore@v4
        with:
          path: travel-map/roads-data
          key: road-tiles-${{ steps.month.outputs.m }}
          restore-keys: road-tiles-            # last month's tiles are kept if this month's build fails
      - name: Build the road tiles from OS Open Roads (monthly)
        id: roads
        if: steps.roadcache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p _roads travel-map
          set -o pipefail
          {
            set -e
            pip install pyproj
            curl -fL --retry 3 -o _roads/openroads.zip "https://api.os.uk/downloads/v1/products/OpenRoads/downloads?area=GB&format=GeoPackage&redirect"
            unzip -q _roads/openroads.zip -d _roads/openroads
            python3 .github/scripts/build_roads.py os "$(find _roads/openroads -name '*.gpkg' | head -1)" _roads/out-os
            mkdir -p travel-map/roads-data && rm -rf travel-map/roads-data/os && mv _roads/out-os travel-map/roads-data/os
            rm -rf _roads/openroads _roads/openroads.zip
          } 2>&1 | tee _roads/os.log
          code=$?
          tail -n 40 _roads/os.log > travel-map/roads-build-os.log   # a short public log, so a failure can be seen from the site
          exit $code
      - name: Build the footpath tiles from an OpenStreetMap extract (monthly)
        id: paths
        if: steps.roadcache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p _roads travel-map
          set -o pipefail
          {
            set -e
            sudo apt-get install -y osmium-tool
            curl -fL --retry 3 -o _roads/gb.osm.pbf https://download.geofabrik.de/europe/great-britain-latest.osm.pbf
            osmium tags-filter --overwrite _roads/gb.osm.pbf w/highway=footway,path,track,cycleway,bridleway,steps,pedestrian -o _roads/paths.osm.pbf
            osmium export --overwrite _roads/paths.osm.pbf -f geojsonseq -o _roads/paths.geojsonseq
            python3 .github/scripts/build_roads.py paths _roads/paths.geojsonseq _roads/out-paths
            mkdir -p travel-map/roads-data && rm -rf travel-map/roads-data/paths && mv _roads/out-paths travel-map/roads-data/paths
          } 2>&1 | tee _roads/paths.log
          code=$?
          tail -n 40 _roads/paths.log > travel-map/roads-build-paths.log
          exit $code
      - name: Check the tiles fit on the site (the Pages limit is about 1 GB in all)
        if: steps.roadcache.outputs.cache-hit != 'true'
        run: |
          if [ -d travel-map/roads-data ]; then
            du -sh travel-map/roads-data
            if [ "$(du -sm travel-map/roads-data | cut -f1)" -gt 700 ]; then echo "Road tiles are too big for the site: leaving them out"; rm -rf travel-map/roads-data; fi
          fi
      - name: Remember the new tiles for the rest of the month
        if: steps.roadcache.outputs.cache-hit != 'true' && steps.roads.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: travel-map/roads-data
          key: road-tiles-${{ steps.month.outputs.m }}
      - name: Write a small build report into the site (so the page can say what happened)
        if: always()
        run: |
          mkdir -p travel-map
          echo "{\"month\":\"${{ steps.month.outputs.m }}\",\"cached\":\"${{ steps.roadcache.outputs.cache-hit }}\",\"roads\":\"${{ steps.roads.outcome }}\",\"paths\":\"${{ steps.paths.outcome }}\"}" > travel-map/roads-status.json
      - name: Leave the build folders out of the site
        run: rm -rf _toolkits _roads
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
